<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Photosynthesis Snake 🌿</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root {
  --accent: #a3e635;
  --bg1: #0f172a;
  --bg2: #14532d;
  --white: #f8fafc;
}
html, body {
  margin: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: system-ui, sans-serif;
  color: var(--white);
  background: radial-gradient(circle at top, #0f172a 0%, #14532d 50%, #0f766e 100%);
  background-size: 200% 200%;
  animation: bgmove 16s ease-in-out infinite;
}
@keyframes bgmove {
  0% {background-position: 0 0;}
  50% {background-position: 100% 100%;}
  100% {background-position: 0 0;}
}
#topbar {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 30;
}
#back-btn {
  background: rgba(15,23,42,0.7);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: 600;
}
#container {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  height: 100%;
  width: 100%;
  gap: 24px;
  padding: 18px clamp(14px, 2vw, 28px);
  box-sizing: border-box;
}

/* HUD */
#hud {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(12px);
  border-radius: 14px;
  padding: 12px 34px;
  display: flex;
  gap: 40px;
  align-items: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  font-size: 20px;
  font-weight: 600;
  z-index: 10;
}

/* Canvas & panel */
#game {
  border-radius: 22px;
  background: #e8ffe9;
  border: 3px solid rgba(248,250,252,0.12);
  box-shadow: 0 0 80px rgba(0,0,0,0.35);
}

.side-panel {
  width: 280px;
  max-width: 25vw;
  background: rgba(15,23,42,0.55);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 20px 22px 16px;
  box-shadow: 0 0 50px rgba(0,0,0,0.35);
  backdrop-filter: blur(15px);
}
.side-panel h2 {
  margin: 0 0 12px 0;
  font-size: 24px;
  letter-spacing: .03em;
}
.target-box {
  background: radial-gradient(circle at top left, rgba(190,242,100,0.22), rgba(15,23,42,0));
  border: 1px solid rgba(190,242,100,0.3);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
.target-name {
  font-size: 20px;
  font-weight: 600;
}
.target-formula {
  font-size: 16px;
  opacity: 0.85;
}
.explain {
  font-size: 14px;
  opacity: 0.7;
  margin-top: 6px;
  line-height: 1.38;
}
.legend {
  font-size: 13px;
  opacity: 0.75;
  margin-top: 14px;
}
.legend div {
  margin: 4px 0;
}

/* Responsive */
@media (max-width: 1050px) {
  #container {flex-direction: column; gap: 14px;}
  .side-panel {width: min(90vw, 480px);}
  #hud {flex-direction: column; gap: 6px; font-size: 16px;}
}
</style>

<!-- Firebase integration -->
<script type="module" src="./firebase.js"></script>
</head>
<body>
<div id="topbar">
  <button id="back-btn" onclick="window.location.href='index.html'">← Back to Lobby</button>
</div>

<div id="hud">
  🌿 Round: <span id="round">1</span>
  🌞 Score: <span id="score">0</span>
  🎯 Target: <span id="targetName">Water</span>
</div>

<div id="container">
  <canvas id="game"></canvas>
  <div class="side-panel">
    <h2>Photosynthesis Info</h2>
    <div class="target-box">
      <div class="target-name" id="targetNameBox">Water</div>
      <div class="target-formula" id="targetFormula">H₂O</div>
      <p class="explain" id="targetExplain">
        Water provides electrons and hydrogen ions during the light reactions.
      </p>
    </div>
    <div class="legend">
      <div>🟩 Grab the molecule that matches the target.</div>
      <div>⬛ Wrong one = you lose.</div>
      <div>⬆️ Move with WASD or Arrow Keys.</div>
      <div>🟢 Safe bubble around you after correct grabs.</div>
    </div>
  </div>
</div>

<script>
let firebaseUser = null;
window.addEventListener("DOMContentLoaded", () => {
  const fs = window.firebaseStuff;
  if (!fs) return;
  fs.onAuth((user) => {
    firebaseUser = user;
    if (!user) {
      window.location.href = "index.html";
    }
  });
});

// ======== GAME LOGIC ========
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const roundEl = document.getElementById("round");
const targetNameEl = document.getElementById("targetName");
const targetNameBox = document.getElementById("targetNameBox");
const targetFormulaEl = document.getElementById("targetFormula");
const targetExplainEl = document.getElementById("targetExplain");

const cols = 15, rows = 15;
let tile = 40;
let half = tile / 2;

let snake = [{x:7,y:7},{x:6,y:7},{x:5,y:7}];
let dir = {x:1,y:0}, pendingDir = {x:1,y:0};

const molecules = [
  { name:"Carbon Dioxide", formula:"CO2", explain:"CO₂ provides carbon for glucose synthesis in the Calvin cycle." },
  { name:"Water",         formula:"H2O", explain:"Water is split in the light reactions to provide electrons and protons." },
  { name:"Oxygen",        formula:"O2",  explain:"O₂ is released as a byproduct from water splitting." },
  { name:"Glucose",       formula:"C6H12O6", explain:"Glucose is the final energy-rich product of photosynthesis." }
];

let currentTarget, items = [], score = 0, round = 1, gameOver = false;

function resizeCanvas(){
  const availableW = window.innerWidth - 330;
  const availableH = window.innerHeight - 150;
  const size = Math.min(availableW, availableH, 720);
  const finalSize = Math.max(360, size);
  const dpr = window.devicePixelRatio || 1;

  canvas.width = finalSize * dpr;
  canvas.height = finalSize * dpr;
  canvas.style.width = finalSize + "px";
  canvas.style.height = finalSize + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  tile = finalSize / cols;
  half = tile / 2;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function setHUD(){
  scoreEl.textContent = score;
  roundEl.textContent = round;
  targetNameEl.textContent = currentTarget.name;
  targetNameBox.textContent = currentTarget.name;
  targetFormulaEl.textContent = currentTarget.formula;
  targetExplainEl.textContent = currentTarget.explain;
}

function manhattan(a,b){
  return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
}
function randomDistractor(except){
  const pool = molecules.filter(m=>m.formula!==except);
  return pool[Math.floor(Math.random()*pool.length)].formula;
}
function startRound(){
  currentTarget = molecules[Math.floor(Math.random()*molecules.length)];
  items = [];
  const count = 7;
  const correctIndex = Math.floor(Math.random()*count);
  const head = snake[0];

  for (let i=0; i<count; i++){
    const correct = i === correctIndex;
    const formula = correct ? currentTarget.formula : randomDistractor(currentTarget.formula);
    let placed = false, attempts = 0;
    while (!placed && attempts < 200) {
      attempts++;
      const x = Math.floor(Math.random()*cols);
      const y = Math.floor(Math.random()*rows);
      if (snake.some(s => s.x === x && s.y === y)) continue;
      if (items.some(it => it.x === x && it.y === y)) continue;
      if (!correct && manhattan({x,y}, head) <= 4) continue;
      items.push({x,y,formula,correct});
      placed = true;
    }
  }
  setHUD();
}

async function sendScoreIfPossible() {
  const fs = window.firebaseStuff;
  if (fs && firebaseUser) {
    await fs.saveScore({
      game: "snake",
      score: score,
      user: firebaseUser
    });
  }
}

function update(){
  if (gameOver) return;
  dir = pendingDir;
  const head = snake[0];
  const nh = {x: head.x + dir.x, y: head.y + dir.y};

  if (nh.x < 0 || nh.x >= cols || nh.y < 0 || nh.y >= rows ||
      snake.some(s => s.x === nh.x && s.y === nh.y)) {
    gameOver = true;
    sendScoreIfPossible();
    return;
  }

  snake.unshift(nh);
  const hit = items.find(it => it.x === nh.x && it.y === nh.y);
  if (hit) {
    if (hit.correct) {
      score++;
      round++;
      startRound();
    } else {
      gameOver = true;
      sendScoreIfPossible();
    }
  } else {
    snake.pop();
  }
}

function drawGrid(){
  const light="#dbffe6", dark="#c1f3d0";
  for (let y=0;y<rows;y++){
    for (let x=0;x<cols;x++){
      ctx.fillStyle = ((x+y)%2===0) ? dark : light;
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }
}
function drawItems(){
  for (const it of items){
    const x = it.x*tile, y = it.y*tile;
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath();
    ctx.roundRect(5,5,tile-10,tile-10,8);
    ctx.fill();
    ctx.fillStyle = "#0f172a";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = (tile*0.42) + "px system-ui";
    ctx.fillText(it.formula, tile/2, tile/2+1);
    ctx.restore();
  }
}
function drawSnake(){
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = tile*0.55;
  const grd = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  grd.addColorStop(0,"#166534");
  grd.addColorStop(1,"#22c55e");
  ctx.strokeStyle = grd;
  ctx.beginPath();
  ctx.moveTo(snake[0].x*tile+half, snake[0].y*tile+half);
  for (let i=1;i<snake.length;i++){
    ctx.lineTo(snake[i].x*tile+half, snake[i].y*tile+half);
  }
  ctx.stroke();

  for (let i=snake.length-1;i>=1;i--){
    const s = snake[i];
    ctx.beginPath();
    ctx.fillStyle = "#22c55e";
    ctx.arc(s.x*tile+half, s.y*tile+half, tile*0.28, 0, Math.PI*2);
    ctx.fill();
  }

  const h = snake[0];
  const hx = h.x*tile+half;
  const hy = h.y*tile+half;
  const headR = tile*0.42;
  const petalCount = 6;
  const petalDist = tile*0.28;
  const petalR = tile*0.16;
  ctx.fillStyle = "#f97316";
  for (let i=0;i<petalCount;i++){
    const ang = (i/petalCount)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(hx + Math.cos(ang)*petalDist, hy + Math.sin(ang)*petalDist, petalR, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.fillStyle = "#fde68a";
  ctx.arc(hx, hy, headR*0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.strokeStyle = "rgba(15,23,42,0.15)";
  ctx.lineWidth = 2;
  ctx.arc(hx, hy, headR*0.5+2, 0, Math.PI*2);
  ctx.stroke();
}
function drawGameOver(){
  ctx.fillStyle="rgba(0,0,0,0.55)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#fff";
  ctx.textAlign="center";
  ctx.font=Math.floor(canvas.width*0.065) + "px system-ui";
  ctx.fillText("Game Over",canvas.width/2,canvas.height/2-18);
  ctx.font=Math.floor(canvas.width*0.035) + "px system-ui";
  ctx.fillText("Press R to restart",canvas.width/2,canvas.height/2+26);
}
function render(){
  drawGrid();
  drawItems();
  drawSnake();
  if (gameOver) drawGameOver();
}
let last=0, step=150;
function loop(ts){
  if (!last) last = ts;
  const d = ts - last;
  if (d > step){
    update();
    last = ts;
  }
  render();
  requestAnimationFrame(loop);
}

window.addEventListener("keydown", e => {
  const k = e.key;
  if ((k==="w"||k==="ArrowUp") && dir.y!==1) pendingDir = {x:0,y:-1};
  else if ((k==="s"||k==="ArrowDown") && dir.y!==-1) pendingDir = {x:0,y:1};
  else if ((k==="a"||k==="ArrowLeft") && dir.x!==1) pendingDir = {x:-1,y:0};
  else if ((k==="d"||k==="ArrowRight") && dir.x!==-1) pendingDir = {x:1,y:0};
  else if (k==="r"||k==="R") {
    if (gameOver){
      snake = [{x:7,y:7},{x:6,y:7},{x:5,y:7}];
      dir = {x:1,y:0};
      pendingDir = {x:1,y:0};
      score = 0;
      round = 1;
      gameOver = false;
      startRound();
    }
  }
});

startRound();
requestAnimationFrame(loop);
</script>
</body>
</html>
