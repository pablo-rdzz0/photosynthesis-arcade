<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photosynthesis Arcade Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --leaf: #14532d;
      --bright: #a3e635;
      --glow: rgba(163,230,53,0.3);
      --bg: radial-gradient(circle at top, #0f172a 0%, #052e16 55%, #022c22 100%);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: system-ui, sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }
    h1 { font-size: 2.3rem; margin-bottom: 8px; }
    p { opacity: 0.8; margin-bottom: 20px; }
    button {
      background: var(--bright);
      border: none;
      color: #0f172a;
      font-weight: 600;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      margin: 6px;
      box-shadow: 0 0 14px var(--glow);
      transition: all 0.2s ease;
    }
    button:hover { background: #d9f99d; transform: scale(1.05); }
    a {
      display: block;
      margin: 8px 0;
      text-decoration: none;
      color: var(--bright);
      font-weight: 600;
    }
    #game-links {
      display: none;
      margin-top: 16px;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #leaderboards {
      margin-top: 30px;
      max-width: 480px;
      background: rgba(15,23,42,0.45);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px 22px;
      box-shadow: 0 0 50px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #leaderboards h3 {
      margin-bottom: 6px;
      font-size: 1.2rem;
      color: #d9f99d;
    }
    #snakeTop, #lightTop {
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-line;
    }

    /* 🌿 Gentle animated background bubbles */
    .bubble {
      position: absolute;
      bottom: -120px;
      background: var(--glow);
      border-radius: 50%;
      animation: float 22s infinite ease-in-out;
    }
    @keyframes float {
      0%   { transform: translateY(0) scale(1); opacity:0.8; }
      50%  { transform: translateY(-60px) scale(1.3); opacity:1; }
      100% { transform: translateY(0) scale(1); opacity:0.8; }
    }

    /* 🪴 Side-by-side leaderboards on wide screens */
    @media (min-width: 900px) {
      #leaderboards {
        flex-direction: row;
        justify-content: center;
        gap: 40px;
        max-width: none;
        width: 100%;
      }
      #leaderboards h3 { margin-top: 0; }
      #snakeTop, #lightTop { min-width: 220px; }
    }
  </style>
</head>
<body>
  <h1>🌿 Photosynthesis Arcade</h1>
  <p>Sign in with your @gmail.com account to play.</p>

  <div id="game-links">
    <a href="snake.html">🐍 Molecules Snake</a>
    <a href="catchthelight.html">💨 Catch the Light (O₂)</a>
  </div>

  <button id="login-btn">Sign in with Google</button>
  <button id="logout-btn" style="display:none;">Logout</button>
  <button id="soundToggle">🔈 Ambient ON</button>

  <audio id="bgSound" src="forest.mp3" loop></audio>

  <div id="user-info"></div>

  <div id="leaderboards">
    <div>
      <h3>🐍 Snake – Top 10</h3>
      <div id="snakeTop">Loading...</div>
    </div>
    <div>
      <h3>💨 Catch the Light – Top 10</h3>
      <div id="lightTop">Loading...</div>
    </div>
  </div>

  <!-- ✅ Firebase setup (shared script) -->
  <script type="module" src="firebase.js"></script>

  <!-- ✅ Lobby logic -->
  <script type="module">
    const fs = window.firebaseStuff;
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const gameLinks = document.getElementById("game-links");

    loginBtn.onclick = () => fs.signIn();
    logoutBtn.onclick = () => fs.signOut();

    fs.onAuth((user) => {
      if (user) {
        userInfo.textContent = `Signed in as ${user.displayName}`;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        gameLinks.style.display = "flex";
      } else {
        userInfo.textContent = "";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        gameLinks.style.display = "none";
      }
    });

    // 🪶 Ambient sound toggle
    const snd = document.getElementById("bgSound");
    const btn = document.getElementById("soundToggle");
    let playing = false;
    btn.onclick = () => {
      if (!playing) {
        snd.play();
        btn.textContent = "🔇 Ambient OFF";
      } else {
        snd.pause();
        btn.textContent = "🔈 Ambient ON";
      }
      playing = !playing;
    };

    // 🧠 Leaderboard
    const snakeTop = document.getElementById("snakeTop");
    const lightTop = document.getElementById("lightTop");

    function renderLeaderboard(container, rows) {
      if (rows.length === 0) {
        container.textContent = "No scores yet!";
        return;
      }
      container.innerHTML = rows
        .map((r, i) => `${i + 1}. ${r.userName || "Anonymous"} — ${r.score}`)
        .join("<br>");
    }

    fs.listenTop("snake", (rows) => renderLeaderboard(snakeTop, rows));
    fs.listenTop("catchthelight", (rows) => renderLeaderboard(lightTop, rows));
  </script>

  <!-- 🌿 Decorative floating bubbles -->
  <script>
    for (let i = 0; i < 12; i++) {
      const b = document.createElement("div");
      b.className = "bubble";
      const s = 20 + Math.random() * 60;
      b.style.width = b.style.height = s + "px";
      b.style.left = Math.random() * 100 + "%";
      b.style.animationDuration = 20 + Math.random() * 10 + "s";
      document.body.appendChild(b);
    }
  </script>
</body>
</html>
