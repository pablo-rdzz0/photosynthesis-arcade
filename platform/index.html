<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photosynthesis Arcade Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0f172a 0%, #166534 55%, #022c22 100%);
      font-family: system-ui, sans-serif;
      color: #fff;
      text-align: center;
    }
    button {
      background: #bef264;
      border: none;
      color: #0f172a;
      font-weight: 600;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      margin: 6px;
    }
    button:hover { background: #d9f99d; }
    a {
      display: block;
      margin: 8px 0;
      text-decoration: none;
      color: #bef264;
      font-weight: 600;
    }
    #links { display: none; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>🌿 Photosynthesis Arcade</h1>
  <p>Sign in with your @gmail.com account to play.</p>

  <div id="links">
    <a href="snake.html">🐍 Molecules Snake</a>
    <a href="catchthelight.html">💨 Catch the Light (O₂)</a>
  </div>

  <button id="login">Sign in with Google</button>
  <button id="logout" style="display:none;">Logout</button>

  <div id="leaderboards">
    <h3>🐍 Snake – Top 10</h3>
    <div id="snakeTop">Loading...</div>
    <h3>💨 Catch the Light – Top 10</h3>
    <div id="lightTop">Loading...</div>
  </div>

  <script type="module" src="./firebase.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const fs = window.firebaseStuff;
      fs.checkRedirect();

      const login = document.getElementById("login");
      const logout = document.getElementById("logout");
      const links = document.getElementById("links");
      const snakeTop = document.getElementById("snakeTop");
      const lightTop = document.getElementById("lightTop");

      fs.onAuth((user) => {
        if (user) {
          login.style.display = "none";
          logout.style.display = "inline-block";
          links.style.display = "block";
          fs.listenTop("snake", (rows) => {
            snakeTop.innerHTML = rows.map(r => `<div>${r.userName || "Anon"} — ${r.score}</div>`).join("") || "No scores yet";
          });
          fs.listenTop("catchthelight", (rows) => {
            lightTop.innerHTML = rows.map(r => `<div>${r.userName || "Anon"} — ${r.score}</div>`).join("") || "No scores yet";
          });
        } else {
          login.style.display = "inline-block";
          logout.style.display = "none";
          links.style.display = "none";
          snakeTop.innerHTML = lightTop.innerHTML = "Loading...";
        }
      });

      login.onclick = () => fs.signIn();
      logout.onclick = () => fs.signOut();
    });
  </script>
</body>
</html>
