<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photosynthesis Arcade Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0f172a 0%, #166534 55%, #022c22 100%);
      font-family: system-ui, sans-serif;
      color: #fff;
      text-align: center;
    }
    button {
      background: #bef264;
      border: none;
      color: #0f172a;
      font-weight: 600;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      margin: 6px;
    }
    button:hover { background: #d9f99d; }
    a {
      display: block;
      margin: 8px 0;
      text-decoration: none;
      color: #bef264;
      font-weight: 600;
    }
    #game-links { display: none; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>🌿 Photosynthesis Arcade</h1>
  <p>Sign in with your @gmail.com account to play.</p>

  <div id="game-links">
    <a href="snake.html">🐍 Molecules Snake</a>
    <a href="catchthelight.html">💨 Catch the Light (O₂)</a>
  </div>

  <button id="login-btn">Sign in with Google</button>
  <button id="logout-btn" style="display:none;">Logout</button>
  <div id="user-info"></div>

  <div id="leaderboards">
    <h3>🐍 Snake – Top 10</h3>
    <div id="snakeTop">Loading...</div>
    <h3>💨 Catch the Light – Top 10</h3>
    <div id="lightTop">Loading...</div>
  </div>

  <!-- ✅ Firebase setup (shared script) -->
  <script type="module" src="/platform/firebase.js"></script>

  <!-- ✅ Lobby logic -->
  <script type="module">
    const fs = window.firebaseStuff;

    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const gameLinks = document.getElementById("game-links");

loginBtn.onclick = () => fs.signIn();

    };

    logoutBtn.onclick = () => fs.signOut();

    fs.onAuth((user) => {
      if (user) {
        userInfo.textContent = `Signed in as ${user.displayName}`;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        gameLinks.style.display = "flex";
      } else {
        userInfo.textContent = "";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        gameLinks.style.display = "none";
      }
    });
  </script>
</body>
</html>
