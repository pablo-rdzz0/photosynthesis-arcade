<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photosynthesis Arcade 🌿</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* --- Organic Forest-Energy Theme --- */
    :root {
      --lime: #bef264;
      --forest1: #0f172a;
      --forest2: #14532d;
      --forest3: #0f766e;
      --white: #f8fafc;
      --glass: rgba(255, 255, 255, 0.08);
      --blur: blur(14px);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, var(--forest1) 0%, var(--forest2) 45%, var(--forest3) 100%);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: hueShift 20s infinite alternate ease-in-out;
    }

    @keyframes hueShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(15deg); }
    }

    /* Floating particles */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 180px 180px;
      opacity: 0.25;
      animation: float 60s linear infinite;
    }
    @keyframes float {
      0% { transform: translate(0,0); }
      100% { transform: translate(-200px, -200px); }
    }

    /* Main container */
    .panel {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass);
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      backdrop-filter: var(--blur);
      max-width: 600px;
      width: 90%;
      z-index: 1;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.4em;
      color: var(--lime);
      text-shadow: 0 0 18px rgba(190,242,100,0.4);
    }

    p {
      opacity: 0.8;
      margin-bottom: 18px;
      font-size: 1.1rem;
    }

    button {
      background: var(--lime);
      color: #0f172a;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      margin: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #d9f99d;
      transform: scale(1.05);
    }

    a {
      display: inline-block;
      margin: 8px 12px;
      text-decoration: none;
      color: var(--lime);
      font-weight: 600;
      font-size: 1.1rem;
      transition: 0.25s ease;
    }

    a:hover {
      text-shadow: 0 0 12px rgba(190,242,100,0.6);
      transform: scale(1.05);
    }

    #game-links {
      display: none;
      margin: 20px 0;
    }

    #user-info {
      margin-top: 8px;
      font-weight: 500;
      opacity: 0.9;
    }

    /* Leaderboard section */
    #leaderboards {
      margin-top: 30px;
      text-align: left;
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 20px 24px;
      box-shadow: inset 0 0 40px rgba(255,255,255,0.04);
    }

    #leaderboards h3 {
      color: var(--lime);
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(190,242,100,0.3);
    }

    #leaderboards div {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 14px;
      white-space: pre-line;
    }

    /* Highlight top score */
    #leaderboards div:first-of-type span:first-child {
      color: #fff;
      font-weight: bold;
      text-shadow: 0 0 8px var(--lime);
    }

    @media (max-width: 600px) {
      .panel { padding: 28px 26px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>🌿 Photosynthesis Arcade</h1>
    <p>Sign in with your <strong>@gmail.com</strong> account to play and climb the leaderboard!</p>

    <div id="game-links">
      <a href="snake.html">🐍 Molecules Snake</a>
      <a href="catchthelight.html">💨 Catch the Light (O₂)</a>
    </div>

    <button id="login-btn">Sign in with Google</button>
    <button id="logout-btn" style="display:none;">Logout</button>

    <div id="user-info"></div>

    <div id="leaderboards">
      <h3>🐍 Snake – Top 10</h3>
      <div id="snakeTop">Loading...</div>
      <h3>💨 Catch the Light – Top 10</h3>
      <div id="lightTop">Loading...</div>
    </div>
  </div>

  <!-- ✅ Firebase setup -->
  <script type="module" src="firebase.js"></script>

  <!-- ✅ Logic -->
  <script type="module">
    const fs = window.firebaseStuff;
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const gameLinks = document.getElementById("game-links");
    const snakeTop = document.getElementById("snakeTop");
    const lightTop = document.getElementById("lightTop");

    loginBtn.onclick = () => fs.signIn();
    logoutBtn.onclick = () => fs.signOut();

    fs.onAuth((user) => {
      if (user) {
        userInfo.textContent = `Signed in as ${user.displayName}`;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        gameLinks.style.display = "block";
      } else {
        userInfo.textContent = "";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        gameLinks.style.display = "none";
      }
    });

    function renderLeaderboard(container, rows) {
      if (rows.length === 0) {
        container.textContent = "No scores yet!";
        return;
      }
      container.innerHTML = rows
        .map((r, i) => `<span>${i + 1}. ${r.userName || "Anonymous"} — ${r.score}</span>`)
        .join("<br>");
    }

    fs.listenTop("snake", (rows) => renderLeaderboard(snakeTop, rows));
    fs.listenTop("catchthelight", (rows) => renderLeaderboard(lightTop, rows));
  </script>
</body>
</html>
