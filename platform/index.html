<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photosynthesis Arcade Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* === Forest Canopy Background === */
    body {
      background: radial-gradient(circle at top, #0f172a 0%, #064e3b 45%, #022c22 100%);
      position: relative;
      overflow: hidden;
    }

    .background, .mist {
      position: absolute;
      inset: 0;
      background-repeat: repeat-x;
      z-index: 0;
      pointer-events: none; /* ✅ Fix for Firebase button clicks */
    }

    .background.back {
      background-image: linear-gradient(to top, #064e3b99 0%, transparent 60%);
      animation: driftBack 45s linear infinite;
      opacity: 0.6;
    }

    .background.front {
      background-image: linear-gradient(to top, #021b16cc 0%, transparent 55%);
      animation: driftFront 60s linear infinite;
      opacity: 0.8;
    }

    .mist::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 20%, rgba(255,255,255,0.05));
      animation: mistDrift 80s linear infinite;
      pointer-events: none;
    }

    @keyframes driftBack {
      from { background-position: 0 0; }
      to { background-position: 400px 0; }
    }
    @keyframes driftFront {
      from { background-position: 0 0; }
      to { background-position: -600px 0; }
    }
    @keyframes mistDrift {
      from { background-position: 0 0; }
      to { background-position: 800px 0; }
    }

    /* === Content === */
    h1 {
      z-index: 5;
      font-size: 2.4rem;
      margin-bottom: 0.4rem;
    }
    p { z-index: 5; }

    button {
      background: #bef264;
      border: none;
      color: #0f172a;
      font-weight: 600;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      margin: 6px;
      z-index: 5;
      position: relative;
    }
    button:hover { background: #d9f99d; }

    a {
      display: block;
      margin: 8px 0;
      text-decoration: none;
      color: #bef264;
      font-weight: 600;
      z-index: 5;
      position: relative;
    }

    #game-links { 
      display: none; 
      margin-top: 16px; 
      flex-direction: column;
    }

    #leaderboards {
      z-index: 5;
      position: relative;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 18px 30px;
      margin-top: 20px;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <!-- Background layers -->
  <div class="background back"></div>
  <div class="background front"></div>
  <div class="mist"></div>

  <h1>🌿 Photosynthesis Arcade</h1>
  <p>Sign in with your @gmail.com account to play.</p>

  <div id="game-links">
    <a href="snake.html">🐍 Molecules Snake</a>
    <a href="catchthelight.html">💨 Catch the Light (O₂)</a>
  </div>

  <button id="login-btn">Sign in with Google</button>
  <button id="logout-btn" style="display:none;">Logout</button>
  <div id="user-info"></div>

  <div id="leaderboards">
    <h3>🐍 Snake – Top 10</h3>
    <div id="snakeTop">Loading...</div>
    <h3>💨 Catch the Light – Top 10</h3>
    <div id="lightTop">Loading...</div>
  </div>

  <!-- ✅ Firebase setup -->
  <script type="module" src="firebase.js"></script>

  <!-- ✅ Lobby logic -->
  <script type="module">
    const fs = window.firebaseStuff;
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const gameLinks = document.getElementById("game-links");

    loginBtn.onclick = () => fs.signIn();
    logoutBtn.onclick = () => fs.signOut();

    fs.onAuth((user) => {
      if (user) {
        userInfo.textContent = `Signed in as ${user.displayName}`;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        gameLinks.style.display = "flex";
      } else {
        userInfo.textContent = "";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        gameLinks.style.display = "none";
      }
    });

    const snakeTop = document.getElementById("snakeTop");
    const lightTop = document.getElementById("lightTop");

    function renderLeaderboard(container, rows) {
      if (rows.length === 0) {
        container.textContent = "No scores yet!";
        return;
      }
      container.innerHTML = rows
        .map((r, i) => `${i + 1}. ${r.userName || "Anonymous"} — ${r.score}`)
        .join("<br>");
    }

    fs.listenTop("snake", (rows) => renderLeaderboard(snakeTop, rows));
    fs.listenTop("catchthelight", (rows) => renderLeaderboard(lightTop, rows));
  </script>
</body>
</html>
