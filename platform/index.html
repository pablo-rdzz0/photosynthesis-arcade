<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photosynthesis Arcade Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --lime: #bef264;
      --dark1: #0f172a;
      --dark2: #064e3b;
      --dark3: #022c22;
      --forest-far: #064e3b99;
      --forest-near: #021b16cc;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: system-ui, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      background: radial-gradient(circle at top, var(--dark1) 0%, var(--dark2) 45%, var(--dark3) 100%);
    }

    /* Layered animated background */
    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-repeat: repeat-x;
      background-size: 800px 100%;
      pointer-events: none;
    }

    /* distant sharp trees */
    body::before {
      background-image: linear-gradient(to top, transparent 60%, var(--forest-far) 100%);
      mask-image: linear-gradient(transparent 0%, black 20%, black 80%, transparent 100%);
      animation: driftBack 45s linear infinite;
    }

    /* foreground sharp trees */
    body::after {
      background-image: linear-gradient(to top, transparent 55%, var(--forest-near) 100%);
      mask-image: linear-gradient(transparent 0%, black 20%, black 80%, transparent 100%);
      animation: driftFront 60s linear infinite;
    }

    @keyframes driftBack {
      from { background-position: 0 0; }
      to { background-position: 400px 0; }
    }
    @keyframes driftFront {
      from { background-position: 0 0; }
      to { background-position: -600px 0; }
    }

    .mist::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.05));
      animation: mistDrift 60s linear infinite;
      z-index: 1;
    }

    @keyframes mistDrift {
      from { background-position: 0 0; }
      to { background-position: 1000px 0; }
    }

    main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 2.8rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.2em;
    }

    p {
      opacity: 0.85;
      margin-top: 0;
      margin-bottom: 20px;
    }

    button {
      background: var(--lime);
      border: none;
      color: var(--dark1);
      font-weight: 600;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      margin: 6px;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    button:hover { background: #d9f99d; }

    a {
      display: block;
      margin: 10px 0;
      text-decoration: none;
      color: var(--lime);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    #game-links {
      display: none;
      margin-top: 18px;
      flex-direction: column;
      gap: 6px;
    }

    #user-info {
      margin-top: 6px;
      font-size: 1rem;
      opacity: 0.9;
    }

    /* Side leaderboards */
    #leaderboards {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 2;
    }

    .board {
      width: 230px;
      max-width: 28vw;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.35);
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: left;
    }

    .board h3 {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
      color: var(--lime);
      font-size: 1.2rem;
    }

    @media (max-width: 900px) {
      #leaderboards {
        flex-direction: column;
        align-items: center;
        gap: 16px;
        position: relative;
        transform: none;
      }
      .board {
        width: 90%;
        max-width: 400px;
      }
    }
  </style>
</head>
<body class="mist">
  <main>
    <h1>🌿 Photosynthesis Arcade</h1>
    <p>Sign in with your @gmail.com account to play.</p>

    <div id="game-links">
      <a href="snake.html">🐍 Molecules Snake</a>
      <a href="catchthelight.html">💨 Catch the Light (O₂)</a>
    </div>

    <button id="login-btn">Sign in with Google</button>
    <button id="logout-btn" style="display:none;">Logout</button>
    <div id="user-info"></div>
  </main>

  <div id="leaderboards">
    <div class="board" id="snakeBoard">
      <h3>🐍 Snake – Top 10</h3>
      <div id="snakeTop">Loading...</div>
    </div>

    <div class="board" id="lightBoard">
      <h3>💨 Catch the Light – Top 10</h3>
      <div id="lightTop">Loading...</div>
    </div>
  </div>

  <!-- ✅ Firebase setup (shared script) -->
  <script type="module" src="firebase.js"></script>

  <!-- ✅ Lobby logic -->
  <script type="module">
    const fs = window.firebaseStuff;

    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const gameLinks = document.getElementById("game-links");
    const snakeTop = document.getElementById("snakeTop");
    const lightTop = document.getElementById("lightTop");

    loginBtn.onclick = () => fs.signIn();
    logoutBtn.onclick = () => fs.signOut();

    fs.onAuth((user) => {
      if (user) {
        userInfo.textContent = `Signed in as ${user.displayName}`;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        gameLinks.style.display = "flex";
      } else {
        userInfo.textContent = "";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        gameLinks.style.display = "none";
      }
    });

    function renderLeaderboard(container, rows) {
      if (rows.length === 0) {
        container.textContent = "No scores yet!";
        return;
      }
      container.innerHTML = rows
        .map((r, i) => `${i + 1}. ${r.userName || "Anonymous"} — ${r.score}`)
        .join("<br>");
    }

    fs.listenTop("snake", (rows) => renderLeaderboard(snakeTop, rows));
    fs.listenTop("catchthelight", (rows) => renderLeaderboard(lightTop, rows));
  </script>
</body>
</html>
