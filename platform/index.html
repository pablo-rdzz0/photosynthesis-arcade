<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🌿 Photosynthesis Arcade Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* ====== Organic Glass Theme ====== */
    :root {
      --leaf-light: #b9f6ca;
      --leaf-dark: #064e3b;
      --gold: #facc15;
      --glass: rgba(255,255,255,0.08);
      --white: #f8fafc;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Inter", system-ui, sans-serif;
      background: radial-gradient(circle at 20% 10%, #166534 0%, #0f172a 80%);
      color: var(--white);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.15;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 60px;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      animation: fadeIn 1s ease-out;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a3e635, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.03em;
      margin: 0;
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #bef26440; }
      to { text-shadow: 0 0 25px #bef264aa; }
    }

    p {
      opacity: 0.85;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    #game-links {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    a {
      text-decoration: none;
      color: #dcfce7;
      font-weight: 600;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px;
      border-radius: 999px;
      transition: all 0.3s ease;
    }

    a:hover {
      background: #bef26433;
      transform: scale(1.04);
    }

    button {
      background: linear-gradient(90deg, #a3e635, #65a30d);
      border: none;
      color: #0f172a;
      font-weight: 700;
      border-radius: 999px;
      padding: 10px 20px;
      cursor: pointer;
      margin: 4px;
      transition: transform 0.2s ease, box-shadow 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(190,242,100,0.4);
    }

    #user-info {
      font-size: 1rem;
      opacity: 0.9;
    }

    #leaderboards {
      margin-top: 20px;
      background: var(--glass);
      border-radius: 16px;
      padding: 20px;
      width: 280px;
      text-align: left;
      backdrop-filter: blur(10px);
    }

    #leaderboards h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #a3e635;
    }

    #leaderboards div {
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #bef264;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      main {
        width: 90%;
        padding: 24px;
      }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>🌿 Photosynthesis Arcade</h1>
    <p>Sign in with your @gmail.com account to play.</p>

    <div id="game-links">
      <a href="snake.html">🐍 Molecules Snake</a>
      <a href="catchthelight.html">💨 Catch the Light (O₂)</a>
    </div>

    <button id="login-btn">Sign in with Google</button>
    <button id="logout-btn" style="display:none;">Logout</button>
    <div id="user-info"></div>

    <div id="leaderboards">
      <h3>🐍 Snake – Top 10</h3>
      <div id="snakeTop"><span class="spinner"></span> Loading...</div>

      <h3>💨 Catch the Light – Top 10</h3>
      <div id="lightTop"><span class="spinner"></span> Loading...</div>
    </div>
  </main>

  <!-- ✅ Firebase setup (shared script) -->
  <script type="module" src="firebase.js"></script>

  <!-- ✅ Lobby logic -->
  <script type="module">
    const fs = window.firebaseStuff;
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const gameLinks = document.getElementById("game-links");
    const snakeTop = document.getElementById("snakeTop");
    const lightTop = document.getElementById("lightTop");

    loginBtn.onclick = () => fs.signIn();
    logoutBtn.onclick = () => fs.signOut();

    fs.onAuth((user) => {
      if (user) {
        userInfo.textContent = `Signed in as ${user.displayName}`;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        gameLinks.style.display = "flex";
      } else {
        userInfo.textContent = "";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        gameLinks.style.display = "none";
      }
    });

    // Leaderboard rendering
    function renderLeaderboard(container, rows) {
      if (!rows.length) {
        container.innerHTML = "No scores yet!";
        return;
      }
      container.innerHTML = rows
        .map((r, i) => `${i + 1}. ${r.userName || "Anonymous"} — ${r.score}`)
        .join("<br>");
    }

    fs.listenTop("snake", (rows) => renderLeaderboard(snakeTop, rows));
    fs.listenTop("catchthelight", (rows) => renderLeaderboard(lightTop, rows));
  </script>
</body>
</html>
